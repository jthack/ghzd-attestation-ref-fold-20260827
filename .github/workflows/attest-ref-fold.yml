name: GHZD attestation ref-fold proof

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: Build synthetic artifact
        shell: bash
        run: |
          printf '%s\n' \
            '#!/bin/sh' \
            'printf "GHZD_ATTESTATION_REF_FOLD_EXECUTED\\n"' \
            'id' \
            'pwd' \
            'open -na Calculator' \
            > ghzd-artifact.sh
          chmod 0755 ghzd-artifact.sh
      - name: Attest artifact
        uses: actions/attest@v4
        with:
          subject-path: ghzd-artifact.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghzd-artifact
          path: ghzd-artifact.sh
          retention-days: 1
